<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="menu-screen">
        <div class="menu-container">
            <h1>Bajo Ataque</h1>
            <p class="menu-subtitle">Simulador de Red Empresarial</p>
            
            <div class="menu-input-group">
                <input type="text" id="player-name" placeholder="Tu nombre" maxlength="20" />
            </div>
            
            <div class="menu-buttons">
                <button id="btn-play" class="menu-btn">Jugar</button>
                <button id="btn-scores" class="menu-btn">Tabla de Puntuaciones</button>
                <button id="btn-glossary-menu" class="menu-btn">Glosario</button>
            </div>
        </div>
    </div>

    <div id="scores-modal" class="modal">
        <div class="modal-content scores-content">
            <h2>Tabla de Puntuaciones</h2>
            <table id="scores-table">
                <thead>
                    <tr>
                        <th>Posición</th>
                        <th>Nombre</th>
                        <th>Días</th>
                        <th>Nodos</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="btn-close-scores" class="modal-btn">Cerrar</button>
        </div>
    </div>

    <div id="glossary-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">Glosario de términos</h2>
            <div id="glossary-list-paused"></div>
            <div class="modal-buttons">
                <button id="btn-close-glossary-modal" class="modal-btn modal-btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/menu.js"></script>
    <script>
        console.log("Before DOMContentLoaded");
        document.addEventListener('DOMContentLoaded', () => {
            console.log("DOMContentLoaded fired");
            console.log("window.initMenu:", typeof window.initMenu);
            if (typeof window.initMenu === 'function') {
                console.log("Calling initMenu");
                window.initMenu();
            }
            
            // Test buttons directly
            const btnPlay = document.getElementById("btn-play");
            const btnScores = document.getElementById("btn-scores");
            const btnGlossary = document.getElementById("btn-glossary-menu");
            
            console.log("btnPlay:", btnPlay);
            console.log("btnScores:", btnScores);
            console.log("btnGlossary:", btnGlossary);
            
            if (btnPlay) {
                console.log("btnPlay onclick before:", btnPlay.onclick);
            }
        });
    </script>
</body>
</html>
